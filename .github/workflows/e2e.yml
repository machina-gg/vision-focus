name: E2E Tests

# pnpm の版は package.json の packageManager が唯一の指定元（#470）。
# ⚠ pnpm/action-setup の version 入力をここに書き戻さないこと。packageManager と
#   完全一致しない限り "Multiple versions of pnpm specified" で全ジョブが落ちる。

# 3 つの起動のしかたで、それぞれ別のコードを検査する。
# - pull_request: PR のコード（main / develop 向けのすべての PR。変更パスでは絞らない）
# - workflow_dispatch: 入力で指定したブランチ
# - schedule: develop（夜間。失敗は notify-failure が Issue に残す）
on:
  pull_request:
    branches: [main, develop]
    # ci.yml と同じタイプにそろえ、ラベルの付与・削除で E2E も再実行できるようにする。
    # 既定のタイプ（opened / synchronize / reopened）は types を書いた時点で自動では付かないため必ず併記する。
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # 毎日 18:00 UTC = 03:00 JST
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'テスト対象ブランチ'
        required: false
        default: 'develop'

# 同じ PR に新しい push が来たら古い実行を止める。
# workflow_dispatch / schedule は run_id で group を分け、互いにも PR の実行とも衝突させない
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 既定は読み取りのみ。Issue 起票が必要なジョブで個別に付与する
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # pull_request では空文字になり、ci.yml と同じ既定の checkout（PR のコード）になる。
        # それ以外は入力のブランチ、入力が無ければ（schedule を含む）develop
        with:
          ref: ${{ github.event_name != 'pull_request' && (github.event.inputs.branch || 'develop') || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        timeout-minutes: 20
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      # 失敗時の調査用。スクリーンショットと動画が入っている
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # 失敗を放置しないための通知。
  # 夜間の実行は誰も見ていない時間に走るため、Issue を立てて残す（PR の失敗は PR の CI に出るので対象外）
  notify-failure:
    if: failure() && github.event_name == 'schedule'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update an issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- e2e-nightly-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 既に起票済みなら重複させずコメントを足す
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-nightly'
            });

            const body = [
              marker,
              '',
              'ナイトリーの E2E が失敗した。',
              '',
              `- 実行: ${runUrl}`,
              `- 対象: \`develop\` (${context.sha.slice(0, 7)})`,
              '',
              'Playwright のレポート（スクリーンショット・動画）は実行結果の artifact から取得できる。',
              '',
              '失敗が実装のバグなら別 Issue に切り出し、テスト側の問題なら修正して閉じる。'
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'test: ナイトリーの E2E が失敗している',
              labels: ['e2e-nightly'],
              body
            });
