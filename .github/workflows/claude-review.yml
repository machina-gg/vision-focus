name: Claude Code Review

# 共有リポジトリ machina-gg/agent-review の reusable workflow を呼び、GitHub Actions 上の Claude が
# この PR をレビューする。レビュー観点と Approve の判定は agent-review 側にあり、呼び方・
# profile の一覧・判定行の契約は agent-review の README.md が SSOT。
#
# ⚠ permissions は呼び出し元が宣言しないと呼び出し先で使えない（reusable workflow は呼び出し元の
#   権限以下しか宣言できず、引き上げはできない）。下の 3 つは agent-review が Approve（reviews API）と
#   レビューコメントの投稿に使うため、ここで与える必要がある。

on:
  pull_request:
    # develop 宛の PR だけを対象にする。develop → main（リリース PR）ではテストだけを通し、
    # LLM レビューと Approve は行わず人間がマージする。
    branches: [develop]
    # labeled / unlabeled / edited は入れない（ラベル操作や本文編集で Claude を再走させない）。
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: machina-gg/agent-review/.github/workflows/review.yml@main
    with:
      profile: chrome-extension
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
