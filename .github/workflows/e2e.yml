name: E2E Tests

# PR ごとには実行しない。
# 拡張機能の E2E は headless 非対応で 3 並列の Chromium を立てるため重く、
# PR のリードタイムを損なう（CI 全体 約40秒 → 数分）。
# ナイトリーとリリース前の手動実行で担保する。
on:
  schedule:
    # 毎日 18:00 UTC = 03:00 JST
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'テスト対象ブランチ'
        required: false
        default: 'develop'

# 既定は読み取りのみ。Issue 起票が必要なジョブで個別に付与する
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        timeout-minutes: 20
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      # 失敗時の調査用。スクリーンショットと動画が入っている
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # 失敗を放置しないための通知。
  # ナイトリーは誰も見ていない時間に走るため、Issue を立てて残す
  notify-failure:
    if: failure() && github.event_name == 'schedule'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update an issue
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2e-nightly-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 既に起票済みなら重複させずコメントを足す
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-nightly'
            });

            const body = [
              marker,
              '',
              'ナイトリーの E2E が失敗した。',
              '',
              `- 実行: ${runUrl}`,
              `- 対象: \`develop\` (${context.sha.slice(0, 7)})`,
              '',
              'Playwright のレポート（スクリーンショット・動画）は実行結果の artifact から取得できる。',
              '',
              '失敗が実装のバグなら別 Issue に切り出し、テスト側の問題なら修正して閉じる。'
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'test: ナイトリーの E2E が失敗している',
              labels: ['e2e-nightly'],
              body
            });
